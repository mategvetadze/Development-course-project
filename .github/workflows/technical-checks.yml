name: Technical checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: careercards_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: careercards_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U careercards_test -d careercards_test_ci'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://careercards_test:disposable-ci-only@127.0.0.1:5432/careercards_test_ci
      APP_ENV: test
      POSTHOG_KEY: ''
      NEXT_PUBLIC_POSTHOG_KEY: ''
      NEXT_PUBLIC_API_URL: http://127.0.0.1:55440
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m compileall -q app scripts tests
        working-directory: backend
      - run: python -m unittest discover -s tests -v
        working-directory: backend
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run lint
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: npm run test:e2e
        working-directory: app
